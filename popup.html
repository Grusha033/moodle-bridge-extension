<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Moodle Bridge</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 10px;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      font-size: 12.5px;
      background: #062147;
      color: #ffffff;
    }
    .frame {
      border-radius: 18px;
      background: linear-gradient(180deg, #1b6dc1 0%, #0d4388 50%, #092c5c 100%);
      border: 4px solid #7dd3fc;
      box-shadow: 0 5px 0 #0369a1, inset 0 2px 0 rgba(255, 255, 255, 0.35);
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .ribbon {
      padding: 5px 22px;
      border-radius: 13px;
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 55%, #d97706 100%);
      border: 2px solid #fef9c3;
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #92400e;
      box-shadow: 0 3px 0 #92400e, inset 0 2px 0 rgba(255, 255, 255, 0.5);
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .stat-card {
      padding: 6px 8px;
      border-radius: 11px;
      background: rgba(6, 33, 71, 0.8);
      border: 2px solid #38bdf8;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 800;
      color: #bae6fd;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 900;
      margin-top: 2px;
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    }
    .stat-val.ok { color: #bef264; }
    .stat-val.err { color: #fda4af; }
    .notice {
      min-height: 18px;
      padding: 6px 9px;
      border-radius: 10px;
      background: rgba(6, 33, 71, 0.72);
      border: 2px solid rgba(125, 211, 252, 0.45);
      font-size: 11.5px;
      font-weight: 700;
      color: #e0f2fe;
      margin-bottom: 10px;
      text-align: center;
    }
    .row {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #bae6fd;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border-radius: 11px;
      border: 2px solid #38bdf8;
      background: #062147;
      color: #ffffff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #fde047;
    }
    .btns {
      display: flex;
      gap: 7px;
      margin-bottom: 7px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 13px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    button:active {
      transform: translateY(2px);
    }
    .btn-green {
      border: 2px solid #d9f99d;
      background: linear-gradient(180deg, #a3e635 0%, #65a30d 55%, #4d7c0f 100%);
      box-shadow: 0 3px 0 #365314, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #365314;
    }
    .btn-orange {
      border: 2px solid #fef08a;
      background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 55%, #d97706 100%);
      box-shadow: 0 3px 0 #92400e, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #92400e;
    }
    .btn-blue {
      border: 2px solid #bae6fd;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      box-shadow: 0 3px 0 #075985, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #075985;
    }
    .btn-pink {
      border: 2px solid #fbcfe8;
      background: linear-gradient(180deg, #f472b6 0%, #db2777 60%, #be185d 100%);
      box-shadow: 0 3px 0 #831843, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #831843;
    }
    .log-box {
      margin-top: 8px;
      border-radius: 12px;
      background: rgba(6, 33, 71, 0.85);
      border: 2px solid rgba(125, 211, 252, 0.45);
      padding: 7px 8px;
      max-height: 150px;
      overflow-y: auto;
    }
    .log-title {
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #fde047;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .log-item {
      padding: 4px 0;
      border-top: 1px solid rgba(125, 211, 252, 0.2);
      font-size: 11px;
      line-height: 1.3;
    }
    .log-item:first-of-type {
      border-top: none;
    }
    .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 900;
      margin-right: 4px;
      text-transform: uppercase;
    }
    .badge-new { background: #65a30d; color: #ffffff; }
    .badge-upd { background: #d97706; color: #ffffff; }
    .log-ans {
      color: #7dd3fc;
      font-weight: 700;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-ver {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      color: #bae6fd;
      text-transform: uppercase;
    }
    .update-banner {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div class="ribbon">MOODLE BRIDGE</div>
    </div>

    <div id="updateBanner" class="update-banner" style="display:none;">
      <button id="downloadUpdateBtn" class="btn-pink" style="width:100%;">СКАЧАТЬ ОБНОВЛЕНИЕ</button>
    </div>

    <div class="status-grid">
      <div class="stat-card">
        <div class="stat-label">Сервер</div>
        <div id="serverState" class="stat-val">...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">MongoDB</div>
        <div id="mongoState" class="stat-val">...</div>
      </div>
    </div>

    <div id="notice" class="notice">Готово к работе</div>

    <div class="btns">
      <button id="pushDbBtn" class="btn-orange">Закинуть тест в БД</button>
    </div>

    <div class="row">
      <label for="bridgeUrl">Адрес сервера</label>
      <input id="bridgeUrl" type="text" placeholder="https://moodle-agent-bridge.onrender.com" />
    </div>

    <div class="btns">
      <button id="saveBtn" class="btn-green">Сохранить</button>
      <button id="syncBtn" class="btn-blue">Синхр. БД</button>
    </div>
    <div class="btns" style="margin-bottom: 0;">
      <button id="resendBtn" class="btn-blue">Обновить стр.</button>
      <button id="toggleBtn" class="btn-pink">Стрелка</button>
    </div>

    <div id="logBox" class="log-box" style="display:none;">
      <div class="log-title">
        <span>Последняя загрузка</span>
        <span id="logSummary"></span>
      </div>
      <div id="logList"></div>
    </div>

    <div class="footer-ver">
      <span id="versionLabel">v1.4.0</span>
      <span id="updateState">Проверка...</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
