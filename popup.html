<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Moodle Bridge</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 325px;
      margin: 0;
      padding: 10px;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      font-size: 12.5px;
      background: #062147;
      color: #ffffff;
    }
    .frame {
      border-radius: 18px;
      background: linear-gradient(180deg, #1b6dc1 0%, #0d4388 50%, #092c5c 100%);
      border: 4px solid #7dd3fc;
      box-shadow: 0 5px 0 #0369a1, inset 0 2px 0 rgba(255, 255, 255, 0.35);
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .ribbon {
      padding: 5px 22px;
      border-radius: 13px;
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 55%, #d97706 100%);
      border: 2px solid #fef9c3;
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #92400e;
      box-shadow: 0 3px 0 #92400e, inset 0 2px 0 rgba(255, 255, 255, 0.5);
    }
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 9px;
    }
    .stat-card {
      padding: 7px 8px;
      border-radius: 11px;
      background: rgba(6, 33, 71, 0.82);
      border: 2px solid #38bdf8;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 800;
      color: #bae6fd;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 900;
      margin-top: 2px;
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    }
    .stat-val.ok { color: #bef264; }
    .stat-val.err { color: #fda4af; }
    .notice {
      min-height: 20px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(6, 33, 71, 0.72);
      border: 2px solid rgba(125, 211, 252, 0.45);
      font-size: 11.5px;
      font-weight: 700;
      color: #e0f2fe;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.35;
    }
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-row {
      display: flex;
      gap: 7px;
    }
    button {
      width: 100%;
      padding: 9px 10px;
      border-radius: 13px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.12s ease;
    }
    button:hover {
      filter: brightness(1.06);
    }
    button:active {
      transform: translateY(2px);
    }
    .btn-sub {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: none;
      opacity: 0.92;
      margin-top: 2px;
    }
    .btn-green {
      border: 2px solid #d9f99d;
      background: linear-gradient(180deg, #a3e635 0%, #65a30d 55%, #4d7c0f 100%);
      box-shadow: 0 3px 0 #365314, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #365314;
    }
    .btn-orange {
      border: 2px solid #fef08a;
      background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 55%, #d97706 100%);
      box-shadow: 0 3px 0 #92400e, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #92400e;
    }
    .btn-blue {
      border: 2px solid #bae6fd;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      box-shadow: 0 3px 0 #075985, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #075985;
    }
    .btn-pink {
      border: 2px solid #fbcfe8;
      background: linear-gradient(180deg, #f472b6 0%, #db2777 60%, #be185d 100%);
      box-shadow: 0 3px 0 #831843, inset 0 2px 0 rgba(255, 255, 255, 0.45);
      text-shadow: 0 1px 0 #831843;
    }
    .settings-box {
      margin-top: 9px;
      padding: 9px;
      border-radius: 12px;
      background: rgba(6, 33, 71, 0.85);
      border: 2px solid rgba(125, 211, 252, 0.45);
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #bae6fd;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      border-radius: 10px;
      border: 2px solid #38bdf8;
      background: #041733;
      color: #ffffff;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      outline: none;
      margin-bottom: 7px;
    }
    input[type="text"]:focus {
      border-color: #fde047;
    }
    .update-banner {
      margin-bottom: 9px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(131, 24, 67, 0.45);
      border: 2px solid #f472b6;
    }
    .update-hint {
      font-size: 10.5px;
      color: #fce7f3;
      margin-top: 6px;
      line-height: 1.3;
      text-align: center;
    }
    .log-box {
      margin-top: 9px;
      border-radius: 12px;
      background: rgba(6, 33, 71, 0.85);
      border: 2px solid rgba(125, 211, 252, 0.45);
      padding: 7px 8px;
      max-height: 140px;
      overflow-y: auto;
    }
    .log-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #fde047;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .log-item {
      padding: 4px 0;
      border-top: 1px solid rgba(125, 211, 252, 0.2);
      font-size: 11px;
      line-height: 1.3;
    }
    .log-item:first-of-type {
      border-top: none;
    }
    .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 900;
      margin-right: 4px;
      text-transform: uppercase;
    }
    .badge-new { background: #65a30d; color: #ffffff; }
    .badge-upd { background: #d97706; color: #ffffff; }
    .log-ans {
      color: #7dd3fc;
      font-weight: 700;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-ver {
      margin-top: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: #bae6fd;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div class="ribbon">MOODLE BRIDGE</div>
    </div>

    <div id="updateBanner" class="update-banner" style="display:none;">
      <button id="downloadUpdateBtn" class="btn-pink">СКАЧАТЬ ОБНОВЛЕНИЕ</button>
      <div class="update-hint">После скачивания запустите update.bat (Windows) или update.sh (Linux/Mac) и нажмите Reload</div>
    </div>

    <div class="status-grid">
      <div class="stat-card">
        <div class="stat-label">Сервер</div>
        <div id="serverState" class="stat-val">...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">База ответов</div>
        <div id="mongoState" class="stat-val">...</div>
      </div>
    </div>

    <div id="notice" class="notice">Откройте тест Moodle — ответы появятся сами</div>

    <div class="action-stack">
      <button id="pushDbBtn" class="btn-orange">
        Сохранить ответы в базу
        <span class="btn-sub">Нажмите на странице результатов теста (review)</span>
      </button>

      <button id="resendBtn" class="btn-green">
        Обновить ответы на странице
        <span class="btn-sub">Перепроверить тест и показать стрелки</span>
      </button>

      <div class="btn-row">
        <button id="toggleBtn" class="btn-pink">Скрыть стрелку</button>
        <button id="settingsToggleBtn" class="btn-blue">Настройки</button>
      </div>
    </div>

    <div id="settingsBox" class="settings-box" style="display:none;">
      <label for="bridgeUrl">Адрес сервера</label>
      <input id="bridgeUrl" type="text" placeholder="https://moodle-agent-bridge.onrender.com" />
      <div class="btn-row" style="margin-bottom: 7px;">
        <button id="saveBtn" class="btn-green">Сохранить</button>
        <button id="syncBtn" class="btn-blue">Синхр. БД</button>
      </div>
      <button id="openExtBtn" class="btn-blue">Открыть chrome://extensions</button>
    </div>

    <div id="logBox" class="log-box" style="display:none;">
      <div class="log-title">
        <span>Последняя загрузка в БД</span>
        <span id="logSummary"></span>
      </div>
      <div id="logList"></div>
    </div>

    <div class="footer-ver">
      <span id="versionLabel">v1.4.1</span>
      <span id="updateState">Проверка...</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
